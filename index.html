<script>
    const words = [
      { text: "Data Science", class: "word-ds" },
      { text: "Cheminformatics", class: "word-chem" },
      { text: "Machine Learning", class: "word-ml" },
      { text: "Manchester United", class: "word-mu" },
      { text: "Quizzing", class: "word-quiz" }
    ];

    let i = 0;
    const el = document.getElementById("typed");

    function showWord() {
      el.className = "";
      void el.offsetWidth; // force reflow
      el.className.add(words[i].class);
      el.textContent = words[i].text;
      el.style.opacity = 1;

      setTimeout(() => {
        el.style.opacity = 0;
        i = (i + 1) % words.length;
        setTimeout(showWord, 600);
      }, 1800);
    }
</script>

    <script>
    function updateClock() {
      const now = new Date();
      const options = {
        timeZone: 'Asia/Kolkata',
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      document.getElementById('clock').textContent =
        now.toLocaleString('en-IN', options) + ' IST';
    }
    setInterval(updateClock, 1000);
    updateClock();
