<head>
    <meta charset="UTF-8">

    <!-- CSS -->

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Neeloy Bhattacharya</h1>
        <p class="typing">
            I love <span id="typed"></span>
        </p>
        <button id="theme-toggle">💡</button>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="blogs.html">Blogs</a>
        <a href="buzzing.html">Buzzing</a>
        <a href="contact.html">Contact</a>
    </nav>

    <section class="card">
        <h2>About Me</h2>
        <p>
            I am interested in cheminformatics, AI-driven molecular modeling,
            and computational science.
        </p>
    </section>

    <script src="js/main.js"></script>
    <footer>
        <span class="footer-quote">The Truth Is Out There</span> · © 2026
    </footer>
    <script>
    const words = [
      { text: "Data Science", class: "word-ds" },
      { text: "Cheminformatics", class: "word-chem" },
      { text: "Machine Learning", class: "word-ml" },
      { text: "Manchester United", class: "word-mu" },
      { text: "Quizzing", class: "word-quiz" }
    ];

    let i = 0;
    const el = document.getElementById("typed");

    function showWord() {
      el.className = words[i].class;
      el.textContent = words[i].text;
      el.style.opacity = 1;

      setTimeout(() => {
        el.style.opacity = 0;
        i = (i + 1) % words.length;
        setTimeout(showWord, 600);
      }, 1800);
    }

    showWord();
    </script>
</body>
